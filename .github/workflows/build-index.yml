name: build-index

# tools/ 폴더에 프로그램 파일을 추가/수정하면, 그 안의 <!--PROGRAM ...--> 메타를 읽어
# programs.js(홈페이지 목록)를 자동으로 다시 만들어 커밋합니다.

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/**'
      - 'build-index.mjs'
      - 'assets/**'
      - '.github/workflows/build-index.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: programs.js·사이트맵·검색 태그 다시 생성
        run: node build-index.mjs

      - name: 변경분 있으면 커밋
        run: |
          if [ -n "$(git status --porcelain programs.js sitemap.xml tools)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add programs.js sitemap.xml tools
            git commit -m "auto: rebuild programs.js, sitemap, SEO tags"
            git push
          else
            echo "변경 없음 — 커밋 생략"
          fi
