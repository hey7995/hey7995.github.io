<meta name="theme-color" content="#0E1520" media="(prefers-color-scheme: dark)">

<style>:root{color-scheme:light}html{padding-top:env(safe-area-inset-top,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<style>
/* Layout: one-column notebook with a fixed bottom tab bar; a 24-cell day strip (4 weeks x 6 study days) is the signature element. */
:root{
  --bg:#EDF0F5; --surface:#FFFFFF; --ink:#16202E; --muted:#586478; --line:#D3D9E3;
  --accent:#2F5BEA; --accent-ink:#FFFFFF; --good:#1B8553; --warn:#9A6A12; --bad:#BE3A3A;
  --hl:#FFE58F; --soft:#F4F6FA; --grid:rgba(22,32,46,.045);
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0E1520; --surface:#172131; --ink:#E5EBF4; --muted:#94A1B6; --line:#2A3548;
    --accent:#7D9CFF; --accent-ink:#0E1520; --good:#4CC38A; --warn:#E3B04B; --bad:#F07A7A;
    --hl:#5A4A12; --soft:#1C283B; --grid:rgba(229,235,244,.045); color-scheme:dark;
  }
}
*{box-sizing:border-box}
body{
  margin:0; background-color:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
}
.wrap{max-width:860px;margin:0 auto;padding-block:16px calc(92px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:6px 14px;margin-bottom:12px}
h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--muted);white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--warn);display:inline-block}
.chip.ok i{background:var(--good)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;gap:2px;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));background:var(--surface);border-top:1px solid var(--line)}
nav.tabs button{flex:1;border:0;background:transparent;padding:8px 2px;border-radius:8px;font-weight:700;font-size:13px;color:var(--muted);min-width:0}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
nav.tabs .n{font-family:var(--f-mono);font-size:11px;margin-left:3px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px;min-width:0}
.panel>h2{margin:0 0 10px;font-size:16px;font-weight:800}
h3{margin:0 0 6px;font-size:14px;font-weight:700}
.hint{color:var(--muted);font-size:13px;margin:0 0 10px}
.strip{display:flex;flex-wrap:wrap;gap:6px 14px}
.wk{display:flex;gap:3px}
.seg{width:22px;height:28px;border-radius:3px;background:var(--soft);border:1px solid var(--line);padding:0;display:block}
.seg.on{border-color:transparent}
.seg.l1{background:color-mix(in srgb,var(--accent) 22%,var(--surface))}
.seg.l2{background:color-mix(in srgb,var(--accent) 36%,var(--surface))}
.seg.l3{background:color-mix(in srgb,var(--accent) 52%,var(--surface))}
.seg.l4{background:color-mix(in srgb,var(--accent) 74%,var(--surface))}
.seg.l5{background:var(--accent)}
.seg.next{border:2px solid var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-top:8px;align-items:center}
.legend .seg{width:14px;height:14px;display:inline-block;vertical-align:-3px;margin-right:4px}
.stats{display:flex;flex-wrap:wrap;gap:8px 28px;margin-top:14px}
.stat b{display:block;font-family:var(--f-mono);font-size:22px;font-weight:500;line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:700;font-size:14px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:3px 10px;font-size:12px}
.btn.warn{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=password],select,textarea{width:100%;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
textarea{resize:vertical;min-height:64px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.row{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.row.two{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.act{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.rate{display:inline-flex;flex-wrap:wrap;gap:3px}
.rate button{width:30px;height:32px;border:1px solid var(--line);background:var(--surface);border-radius:6px;font-family:var(--f-mono)}
.rate button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.wkhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;align-items:baseline;margin:6px 0 8px}
.wkhead h2{margin:0;font-size:16px;font-weight:800}
.day{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;background:var(--surface)}
.day.done{background:var(--soft)}
.dh{display:flex;align-items:center;gap:10px;min-width:0}
.dh .dn{font-family:var(--f-mono);font-size:13px;color:var(--muted);flex:none}
.dh .tt{font-weight:700;flex:1;min-width:0}
.dh .plan{font-family:var(--f-mono);font-size:12px;color:var(--muted);flex:none}
.ck{width:22px;height:22px;flex:none;accent-color:var(--accent)}
.df{display:grid;gap:8px 10px;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));margin-top:8px;align-items:end}
.df .memo{grid-column:1/-1}
.of{display:flex;align-items:center;gap:6px}
.of span{font-family:var(--f-mono);color:var(--muted);white-space:nowrap}
.dl{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.dl.done{background:var(--soft)}
.dl .dn{font-family:var(--f-mono);font-size:13px;color:var(--muted);flex:none;width:34px}
.dl .tt{font-weight:700;flex:1;min-width:0}
.dl .st{font-family:var(--f-mono);font-size:12px;color:var(--muted);flex:none}
.dl.next{border:2px solid var(--ink)}
.w{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;background:var(--surface);min-width:0}
.w.grad{background:var(--soft)}
.wh{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-bottom:6px}
.tag{font-family:var(--f-mono);font-size:12px;padding:1px 8px;border-radius:4px;border:1px solid var(--line);background:var(--soft)}
.tag.hl{background:var(--hl);border-color:transparent}
.tag.good{color:var(--good);border-color:var(--good);background:transparent}
.tag.bad{color:var(--bad);border-color:var(--bad);background:transparent}
.q{font-weight:700;overflow-wrap:anywhere}
.qa{display:grid;gap:4px 14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-top:6px;font-size:14px}
.qa dt{font-size:12px;color:var(--muted)}
.qa dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.rt{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)}
.rt>div{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rt .lbl{font-size:12px;color:var(--muted)}
.ox{display:inline-flex;gap:3px}
.ox button{padding:3px 12px;border:1px solid var(--line);background:var(--surface);border-radius:5px;font-family:var(--f-mono)}
.ox button.o[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--bg)}
.ox button.x[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:var(--bg)}
.filters{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin-bottom:12px}
.empty{color:var(--muted);padding:18px 4px;text-align:center}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:500}
td.n,th.n{text-align:right;font-family:var(--f-mono)}
.bar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--accent)}
ul.plain{margin:0;padding-left:18px}
ul.plain li{margin-bottom:4px;overflow-wrap:anywhere}
ol.min{margin:0;padding-left:20px}
ol.min li{margin-bottom:2px}
ol.min b{font-family:var(--f-mono);font-weight:500;margin-right:6px}
textarea.out{font-family:var(--f-mono);font-size:12px;min-height:160px;margin-top:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
/* textbook */
.back{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.dtitle{font-size:22px;font-weight:800;letter-spacing:-.01em;margin:0 0 4px;text-wrap:balance}
.sec{margin:16px 0 6px;font-size:13px;font-weight:800;color:var(--accent);letter-spacing:.02em}
.concept{margin:0;padding-left:20px}
.concept li{margin-bottom:6px}
.formula{background:var(--soft);border-left:3px solid var(--accent);padding:7px 12px;margin-bottom:4px;border-radius:0 6px 6px 0;font-family:var(--f-mono);font-size:13.5px;overflow-x:auto;white-space:nowrap}
.example{background:var(--soft);border-left:3px solid var(--warn);padding:7px 12px;margin-bottom:4px;border-radius:0 6px 6px 0}
.intro{background:var(--soft);border-left:3px solid var(--accent);padding:10px 14px;margin:12px 0 4px;border-radius:0 8px 8px 0;font-size:14.5px}
.fnote{font-size:13px;color:var(--muted);margin:-1px 0 8px;padding-left:15px;line-height:1.5}
.exq{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;background:var(--surface)}
.steps{margin:8px 0 0;padding-left:22px;font-size:14px}
.steps li{margin-bottom:5px;overflow-wrap:anywhere}
.box{border-radius:8px;padding:10px 12px 10px 8px;margin-bottom:4px;font-size:14px}
.warnbox{background:var(--soft);border-left:3px solid var(--bad)}
.exambox{background:var(--soft);border-left:3px solid var(--good)}
.box ul.plain li{margin-bottom:6px}
.pq{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;background:var(--surface)}
.ans{margin-top:8px;padding:8px 10px;background:var(--soft);border-radius:6px;font-size:14px;overflow-wrap:anywhere}
.ans .lbl{font-size:12px;color:var(--muted);margin-right:6px}
.mk{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.mk .btn[aria-pressed="true"].o{background:var(--good);border-color:var(--good);color:var(--bg)}
.mk .btn[aria-pressed="true"].x{background:var(--bad);border-color:var(--bad);color:var(--bg)}
.tp{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:6px;font-size:12px;color:var(--muted)}
.tp button{padding:2px 9px;border:1px solid var(--line);background:var(--surface);border-radius:5px;font-size:12px}
.tp button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fs{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.fs .k{flex:none;width:96px;color:var(--muted);font-size:12px;padding-top:2px}
.fs .v{font-family:var(--f-mono);font-size:13px;overflow-wrap:anywhere}
.fig{margin:14px 0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 10px 8px}
.fig svg{display:block;width:100%;max-width:560px;height:auto;margin:0 auto}
.fig text{font-family:var(--f-body);fill:var(--ink);font-size:16px}
.fig .mono{font-family:var(--f-mono)}
.fig .sh{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round}
.fig .rt{fill:none;stroke:var(--muted);stroke-width:1.6}
.fig .ar{fill:none;stroke:var(--accent);stroke-width:2}
.fig .ca{fill:var(--accent);font-weight:700}
.fig .cb{fill:var(--good);font-weight:700}
.fig .cc{fill:var(--warn);font-weight:700}
.fig .sm{font-size:13.5px;fill:var(--muted)}
.fig .ax{fill:none;stroke:var(--muted);stroke-width:1.6}
.fig .dsh{fill:none;stroke:var(--muted);stroke-width:1.3;stroke-dasharray:5 5;opacity:.8}
.fig .cv{fill:none;stroke:var(--accent);stroke-width:2.6;stroke-linejoin:round}
.fig .nd{fill:var(--ink)}
.fig .wire{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round}
.fig .bx{fill:var(--surface);stroke:var(--ink);stroke-width:2}
.fig .bat{fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round}
.fig .hd{fill:var(--ink)}
.fig .ha{fill:var(--accent)}
.fig .hb{fill:var(--good)}
.fig .hc{fill:var(--warn)}
.fig figcaption{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.55}
sub,sup{line-height:0}
.install{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.chk{display:flex;gap:8px;align-items:flex-start;padding:4px 0;font-size:14px}
@media (max-width:520px){h1{font-size:23px}.panel{padding:12px}.seg{width:17px;height:25px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>

<script>
(function () {
  "use strict";
  var C = window.JGISA_CONTENT;
  if (!C || !C.days) { document.getElementById("view").innerHTML = '<section class="panel"><h2>교재를 불러오지 못했어요</h2><p class="hint">content.js 를 확인해 주세요.</p></section>'; return; }
  var DAYS = C.days, WEEKS = C.weeks, FSUM = C.formulaSummary || [];
  DAYS.forEach(function (d, i) { d.i = i + 1; if (d.id == null) d.id = String(d.n); });
  var KEY = "jgisa-studylog-v2";
  var TYPES = { A: "개념 이해 부족", B: "공식 암기 실수", C: "계산 실수", D: "문제 읽기 실수", E: "단위·부호 실수" };
  var TYPE_SHORT = { A: "개념", B: "공식", C: "계산", D: "읽기", E: "단위" };
  var PLAN90 = [["10분", "전날 공식과 오답 훑어보기"], ["30분", "교재 개념과 공식 읽기, 공식은 손으로 한 번 쓰기"], ["15분", "예제를 가리고 직접 풀기"], ["25분", "연습문제 풀기 (정답은 다 푼 뒤에 보기)"], ["10분", "채점하고 틀린 문제 확인"]];

  var $ = function (s, el) { return (el || document).querySelector(s); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var fmt = function (s) { return esc(s).replace(/_\{([^}]*)\}/g, "<sub>$1</sub>").replace(/\^\{([^}]*)\}/g, "<sup>$1</sup>"); };
  var plain = function (s) { return String(s == null ? "" : s).replace(/_\{([^}]*)\}/g, "$1").replace(/\^\{([^}]*)\}/g, "^$1"); };
  var pad = function (n) { return String(n).padStart(2, "0"); };

        var j = JSON.parse(r.result), src = j && j.docs ? j.docs : j, out = {}, n = 0;
        Object.keys(src || {}).forEach(function (k) {
          if (!/^(cfg|d\d\d|c\d|w[a-z0-9]{3,})$/.test(k)) return;
          var v = src[k]; if (!v || typeof v !== "object" || Array.isArray(v)) return;
          out[k] = v; n++;
        });

  }

    if (!importPrev) return;

    var n = importPrev.count; importPrev = null; toast(n + "개 기록을 불러왔어요."); render(true);
  }
  function doAuth(kind) {
    var em = ($("#em") || {}).value || "", pw = ($("#pw") || {}).value || "";

    var p = kind === "login" ? auth.signInWithEmailAndPassword(em.trim(), pw) : kind === "signup" ? auth.createUserWithEmailAndPassword(em.trim(), pw) : auth.sendPasswordResetEmail(em.trim());
    p.then(function () { if (kind === "reset") { toast("재설정 메일을 보냈어요."); } }).catch(function (e) { sync.msg = authErr(e); render(true); });
  }

  /* ---------- init ---------- */
  window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); window.__installEvt = e; render(); });
  load();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { }
  render(true);
  initSync();
  if ("serviceWorker" in navigator) window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () { }); });
})();
