<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>발라드 워밍업</title>
<meta name="theme-color" content="#EEEFF5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14121D" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="워밍업">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>:root{color-scheme:light}html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<style>
/* Layout concept: one focal breathing orb that grows and shrinks with the voice cue, a 5-part progress strip above it, and tuning controls plus the routine list beside or below. */
:root{
  --bg:#EEEFF5; --surface:#F8F8FC; --fg:#1D1A2A; --muted:#625E78; --line:#D6D4E3;
  --accent:#B0366A; --accent-ink:#FFFFFF; --accent-soft:#F2DAE6;
  --breath:#33639F; --breath-soft:#D8E4F4;
  --rest-soft:#E3E2EC; --rest-line:#9A97AE;
  --display:"Hahmlet","Noto Serif KR","Nanum Myeongjo",serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14121D; --surface:#1D1A2B; --fg:#EDEBF7; --muted:#A5A1BC; --line:#332F49;
    --accent:#EE6FA2; --accent-ink:#1B0D15; --accent-soft:#3C2236;
    --breath:#86AEEB; --breath-soft:#212E47;
    --rest-soft:#2A2740; --rest-line:#6C6886;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14121D; --surface:#1D1A2B; --fg:#EDEBF7; --muted:#A5A1BC; --line:#332F49;
  --accent:#EE6FA2; --accent-ink:#1B0D15; --accent-soft:#3C2236;
  --breath:#86AEEB; --breath-soft:#212E47;
  --rest-soft:#2A2740; --rest-line:#6C6886;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font:15px/1.55 var(--body);
  padding-block:20px 44px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
button{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

.app{max-width:980px; margin:0 auto}
.top{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; flex-wrap:wrap}
.top h1{font:800 1.35rem/1.2 var(--display); margin:0}
.modes{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px; margin:0 0 16px}
@media (min-width:560px){ .modes{grid-template-columns:repeat(4,minmax(0,1fr))} }
.modes button{display:grid; justify-items:center; gap:1px; min-width:0; min-height:48px; padding:6px 8px; border:1px solid var(--line); border-radius:10px; background:transparent; cursor:pointer; font-size:14px; font-weight:500}
.modes button small{font-size:11px; font-weight:400; color:var(--muted)}
.modes button[aria-pressed="true"]{background:var(--accent-soft); border-color:var(--accent); font-weight:600}
.modes button:disabled{opacity:.45; cursor:default}
.top .meta{margin:2px 0 0; color:var(--muted); font-size:13px}
.layout{display:grid; gap:24px; grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){ .layout{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); align-items:start} }

.btn{border-radius:10px; min-height:44px; padding:10px 16px; cursor:pointer; border:1px solid var(--line); background:transparent; font-weight:500}
.btn:hover{border-color:var(--rest-line)}
.btn:disabled{opacity:.45; cursor:default}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600; font-size:16px; min-height:52px}
.btn.small{min-height:36px; padding:6px 12px; font-size:13px}

/* stage */
.stage{
  --orb-fill:var(--rest-soft); --orb-line:var(--rest-line);
  background:var(--surface); border:1px solid var(--line); border-radius:14px;
  padding:18px 16px 18px; min-width:0;
}
.stage[data-kind="breath"],.stage[data-kind="stretch"]{--orb-fill:var(--breath-soft); --orb-line:var(--breath)}
.stage[data-kind="sing"]{--orb-fill:var(--accent-soft); --orb-line:var(--accent)}

.steps{display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:4px}
.steps button{background:none; border:0; padding:4px 0 0; text-align:left; color:var(--muted); font-size:11px; font-weight:500; cursor:pointer; display:grid; gap:6px; min-width:0; word-break:keep-all}
.steps button[aria-current="step"]{color:var(--fg); font-weight:600}
.bar{height:4px; background:var(--line); border-radius:2px; overflow:hidden}
.bar i{display:block; height:100%; width:0; background:var(--accent)}

.orb-wrap{position:relative; width:min(100%,300px); aspect-ratio:1; margin:20px auto 8px}
.orb-ring{position:absolute; inset:0; border-radius:50%; border:1.5px solid var(--line)}
.orb-ring::after{content:""; position:absolute; inset:25%; border-radius:50%; border:1px dashed var(--line)}
.orb{position:absolute; inset:0; border-radius:50%; background:var(--orb-fill); border:3px solid var(--orb-line); transform:scale(.58); will-change:transform}
.count{position:absolute; inset:0; display:grid; place-content:center; text-align:center; pointer-events:none}
.count span{font:700 2.8rem/1 var(--display); font-variant-numeric:tabular-nums}
.count small{font-size:12px; color:var(--muted); letter-spacing:.08em; margin-top:6px}

.cue{text-align:center}
.chips{display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin:0; font-size:12px; color:var(--muted); letter-spacing:.04em}
.cue h2{font:700 clamp(1.5rem,5.4vw,2rem)/1.25 var(--display); margin:6px 0 4px; text-wrap:balance}
.hint{max-width:46ch; margin:0 auto; min-height:calc(1.55em*3); color:var(--muted); text-wrap:pretty}

.notes{display:flex; justify-content:center; align-items:flex-end; gap:8px; height:84px; margin-top:8px}
.notes[data-empty="true"]{visibility:hidden}
.nt{display:flex; flex-direction:column; align-items:center; gap:4px; width:22px}
.nt span{display:block; width:14px; border-radius:3px; background:var(--line); transition:background .15s}
.nt span.on{background:var(--accent)}
.nt span.past{background:var(--rest-line)}
.nt small{font-size:11px; color:var(--muted); height:14px; line-height:14px}

.next{text-align:center; color:var(--muted); font-size:13px; margin:6px 0 14px}
.controls{display:grid; grid-template-columns:1fr 1.7fr 1fr; gap:8px}
.controls .btn{min-width:0; padding-inline:8px}
.timeline{display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:center; margin-top:16px; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}

/* side column */
.side{display:grid; gap:24px; min-width:0}
.side h2{font:700 1.05rem/1.3 var(--display); margin:0 0 6px}
.row{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 0; border-top:1px solid var(--line); flex-wrap:wrap}
.row .lab{font-size:14px}
.seg{display:grid; grid-template-columns:1fr 1fr; gap:6px}
.seg button{border:1px solid var(--line); background:transparent; border-radius:10px; padding:8px 12px; cursor:pointer; font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent-soft); border-color:var(--accent); font-weight:600}
.stepper{display:flex; align-items:center; gap:8px}
.stepper button{width:36px; height:36px; border:1px solid var(--line); border-radius:10px; background:transparent; cursor:pointer; font-size:18px; line-height:1}
.stepper output{min-width:10ch; text-align:center; font-variant-numeric:tabular-nums; font-size:14px}
input[type="checkbox"],input[type="range"]{accent-color:var(--accent)}
input[type="checkbox"]{width:20px; height:20px}
input[type="range"]{width:min(180px,100%)}
.note{margin:0; padding-top:4px; font-size:13px; color:var(--muted)}

.routine ol{list-style:none; margin:0; padding:0; border-bottom:1px solid var(--line)}
.routine li button{width:100%; display:grid; grid-template-columns:14px minmax(0,1fr) auto; gap:2px 12px; align-items:baseline; text-align:left; background:none; border:0; border-top:1px solid var(--line); padding:12px 0; cursor:pointer}
.routine .dot{width:10px; height:10px; border-radius:50%; border:1.5px solid var(--muted); align-self:center}
.routine li[data-state="active"] .dot{background:var(--accent); border-color:var(--accent)}
.routine li[data-state="done"] .dot{background:var(--muted)}
.routine .nm{font-weight:600}
.routine li[data-state="done"] .nm{color:var(--muted)}
.routine .tm{font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums}
.routine .ds{grid-column:2/4; font-size:13px; color:var(--muted)}
.safety{font-size:13px; color:var(--muted); margin:0}

@media (prefers-reduced-motion: reduce){ .nt span{transition:none} }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <h1>발라드 워밍업</h1>
      <p class="meta" id="meta"></p>
    </div>
    <button class="btn small" id="resetBtn" type="button">처음으로</button>
  </header>

  <div class="modes" id="modes" role="group" aria-label="루틴 선택"></div>

  <div class="layout">
    <section class="stage" id="stage" data-kind="rest" aria-label="현재 동작">
      <div class="steps" id="steps"></div>

      <div class="orb-wrap" aria-hidden="true">
        <div class="orb-ring"></div>
        <div class="orb" id="orb"></div>
        <div class="count"><span id="count">0:00</span><small id="tag">전체</small></div>
      </div>

      <div class="cue">
        <p class="chips"><span id="chipStep"></span><span id="chipRep" hidden></span></p>
        <h2 id="cueTitle" aria-live="polite"></h2>
        <p class="hint" id="cueHint"></p>
      </div>

      <div class="notes" id="notes" data-empty="true" aria-hidden="true"></div>
      <p class="next" id="next"></p>

      <div class="controls">
        <button class="btn" id="prevBtn" type="button">이전 구간</button>
        <button class="btn primary" id="mainBtn" type="button">시작하기</button>
        <button class="btn" id="nextBtn" type="button">다음 구간</button>
      </div>

      <div class="timeline">
        <span id="elapsedTxt">0:00</span>
        <div class="bar"><i id="totalBar"></i></div>
        <span id="remainTxt">-0:00</span>
      </div>
    </section>

    <div class="side">
      <section aria-labelledby="sTitle">
        <h2 id="sTitle">안내 설정</h2>
        <div class="row">
          <span class="lab" id="lblRange">목소리 높이</span>
          <div class="seg" role="group" aria-labelledby="lblRange">
            <button type="button" id="gM" aria-pressed="true">남성 · 낮게</button>
            <button type="button" id="gF" aria-pressed="false">여성 · 높게</button>
          </div>
        </div>
        <div class="row">
          <span class="lab" id="lblShift">시작음 (반음 조정)</span>
          <div class="stepper" role="group" aria-labelledby="lblShift">
            <button type="button" id="shDown" aria-label="반음 내리기">−</button>
            <output id="rootTxt" aria-live="polite">C3 · 131Hz</output>
            <button type="button" id="shUp" aria-label="반음 올리기">+</button>
          </div>
        </div>
        <div class="row">
          <label class="lab" for="voiceChk">안내 음성</label>
          <input type="checkbox" id="voiceChk" role="switch">
        </div>
        <div class="row">
          <label class="lab" for="toneChk">기준 안내음</label>
          <input type="checkbox" id="toneChk" role="switch">
        </div>
        <div class="row">
          <label class="lab" for="vol">안내음 볼륨</label>
          <input type="range" id="vol" min="0" max="100" step="1">
        </div>
        <div class="row">
          <span class="lab">시작음을 먼저 들어보세요</span>
          <button class="btn small" id="previewBtn" type="button">시작음 듣기</button>
        </div>
        <p class="note" id="voiceNote" hidden></p>
      </section>

      <section class="routine" aria-labelledby="rTitle">
        <h2 id="rTitle">오늘의 루틴</h2>
        <ol id="routine"></ol>
      </section>

      <p class="safety">통증이 있거나 쉰 소리가 나면 바로 멈추세요. 목을 가다듬는 헛기침 대신 침을 삼키거나 허밍을 하면 됩니다. 코막힘이 계속되면 이비인후과 진료를 받아 보세요.</p>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const COUNT = ['하나','둘','셋','넷','다섯','여섯','일곱','여덟','아홉','열'];
const NOTE_NAMES = ['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const SOLFEGE = {0:'도',2:'레',4:'미',5:'파',7:'솔'};
const midiFreq = m => 440*Math.pow(2,(m-69)/12);
const noteName = m => NOTE_NAMES[((m%12)+12)%12] + (Math.floor(m/12)-1);
const fmt = s => { s = Math.max(0,Math.round(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
const clamp = (x,a,b) => Math.min(b,Math.max(a,x));

/* ---------- settings (per viewer) ---------- */
const KEY = 'ballad-warmup-v1';
const settings = {gender:'m', shift:0, voice:true, tone:true, vol:60, mode:'warmup'};
try{
  const raw = localStorage.getItem(KEY);
  if(raw){ Object.assign(settings, JSON.parse(raw)); }
}catch(e){}
settings.gender = settings.gender === 'f' ? 'f' : 'm';
settings.shift = clamp(Number(settings.shift)||0, -5, 5);
settings.vol = clamp(Number(settings.vol)||0, 0, 100);
settings.voice = settings.voice !== false;
settings.tone = settings.tone !== false;
if(['warmup','tone','style','cooldown'].indexOf(settings.mode) < 0) settings.mode = 'warmup';
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(settings)); }catch(e){} };
const rootMidi = () => (settings.gender === 'm' ? 48 : 60) + settings.shift;

/* ---------- routine data ---------- */
let steps = [];
function mk(short,name,desc){ const s = {short,name,desc,cues:[]}; steps.push(s); return s; }
function add(s,o){ s.cues.push(Object.assign({lead:0,anim:'steady',tone:null,say:'',phases:null,rep:0,reps:0},o)); }
const prep = (s,title,hint,say,dur) => add(s,{kind:'prep',tag:'준비',dur,title,hint,say,anim:'rest'});
const rest = (s,dur,title,hint) => add(s,{kind:'rest',tag:'쉬기',dur,title:title||'숨 고르기',hint:hint||'코로 편하게 숨을 들이쉽니다.',anim:'rest'});

const stg = (s,dur,title,hint,say,extra) => add(s,Object.assign({kind:'stretch',tag:'스트레칭',dur:dur,anim:'steady',title:title,hint:hint,say:say},extra||{}));

function buildWarmup(){
/* 0. 근육 스트레칭 */
const s0 = mk('스트레칭','근육 스트레칭','목·어깨·턱·혀·가슴·옆구리 풀기');
prep(s0,'편하게 서기','발을 어깨너비로 벌리고 섭니다. 목은 세게 젖히거나 돌리지 마세요. 아프면 바로 멈춥니다.','발을 어깨너비로 벌리고 서세요. 아프면 바로 멈추세요.',6);
stg(s0,15,'목 옆선 · 오른쪽','고개를 오른쪽으로 기울이고 왼쪽 어깨는 아래로 내립니다. 어깨를 올리지 않습니다.','고개를 오른쪽으로 기울이고, 왼쪽 어깨는 아래로 내리세요.');
stg(s0,15,'목 옆선 · 왼쪽','고개를 왼쪽으로 기울이고 오른쪽 어깨는 아래로 내립니다.','이번에는 왼쪽으로 기울이세요.');
stg(s0,10,'턱 당기기','시선은 정면에 두고 턱을 뒤로 가볍게 당겨 뒷목을 길게 늘립니다.','턱을 가볍게 당겨서 뒷목을 늘리세요.',{rep:1,reps:2});
rest(s0,3);
stg(s0,10,'턱 당기기','시선은 정면에 두고 턱을 뒤로 가볍게 당겨 뒷목을 길게 늘립니다.','한 번 더 하세요.',{rep:2,reps:2});
prep(s0,'어깨 으쓱','어깨를 귀까지 올렸다가 툭 떨어뜨립니다. 다섯 번 합니다.','어깨를 귀까지 올렸다가 툭 떨어뜨리세요.',6);
for(let i=0;i<5;i++){
  stg(s0,3,'어깨 으쓱 툭','올릴 때 숨을 들이쉬고, 떨어뜨리며 내쉽니다.',COUNT[i],{anim:'swell',rep:i+1,reps:5});
}
stg(s0,12,'어깨 크게 돌리기','어깨를 뒤로 크게 천천히 돌립니다. 가슴이 열리는 느낌으로 합니다.','어깨를 뒤로 크게 돌리세요.');
stg(s0,15,'턱 근육 풀기','광대 아래 턱 근육을 손가락으로 작은 원을 그리며 풀어 줍니다. 세게 누르지 않습니다.','광대 아래 턱 근육을 손가락으로 부드럽게 문질러 풀어 주세요.');
prep(s0,'턱 열고 닫기','하품하듯 입을 천천히 열고 닫습니다. 소리가 나거나 아프면 범위를 줄입니다.','하품하듯 입을 천천히 열고 닫으세요.',5);
for(let i=0;i<5;i++){
  stg(s0,4,'턱 천천히 열고 닫기','열 때 숨을 들이쉬고, 닫을 때 내쉽니다.',COUNT[i],{anim:'swell',rep:i+1,reps:5});
}
stg(s0,10,'혀 늘리기','혀를 앞으로 길게 내밀고 아래턱 쪽으로 늘렸다가 좌우로 천천히 움직입니다.','혀를 길게 내밀고 천천히 좌우로 움직이세요.');
stg(s0,10,'입술 푸르르','입술을 가볍게 모아 푸르르 떨어 줍니다. 입 주변 힘을 뺍니다.','입술을 푸르르 떨어 주세요.');
stg(s0,15,'가슴 열기','양손을 등 뒤에서 깍지 끼고 가슴을 펴며 어깨를 뒤로 모읍니다. 허리는 꺾지 않습니다.','양손을 등 뒤에서 깍지 끼고 가슴을 펴세요.');
stg(s0,15,'옆구리 늘리기 · 오른팔','오른팔을 머리 위로 올려 몸을 왼쪽으로 기울입니다. 앞으로 숙이지 않습니다.','오른팔을 올리고 몸을 왼쪽으로 기울이세요.');
stg(s0,15,'옆구리 늘리기 · 왼팔','왼팔을 머리 위로 올려 몸을 오른쪽으로 기울입니다. 갈비뼈 옆이 늘어나는 느낌을 찾습니다.','왼팔을 올리고 몸을 오른쪽으로 기울이세요.');

/* ===== 톤 만들기 ===== */
function buildTone(){
  const t1 = mk('공간','목 안 공간 만들기','하품 자세로 둥근 톤 찾기');

  prep(t1,'하품 자세','하품하기 직전처럼 목 안을 넓히고, 입은 작고 둥글게 둡니다. 혀는 편하게 눕힙니다.','하품하기 직전처럼 목 안을 넓히고, 오 소리를 내세요.',6);
  [0,1,2,1].forEach((r,i)=>{
    add(t1,{kind:'sing',tag:'소리',dur:9,lead:1,anim:'steady',title:'하품 자세로 "오~"',hint:'목 안이 넓어지면 소리가 둥글고 따뜻해집니다. 목을 누르거나 조이지 않습니다.',say:COUNT[i],rep:i+1,reps:4,tone:{type:'hold',rise:r}});
    rest(t1,3);
  });

  const t2 = mk('밝기','앞 공명으로 밝기 주기','허밍에서 모음으로 이어 앞쪽 울림 유지');
  prep(t2,'허밍에서 아로','코 옆을 울리는 허밍으로 시작해 입을 열어도 울림을 앞쪽에 둡니다. 코로만 밀어내지 않습니다.','음으로 시작해서, 입을 열어 아로 이어가세요. 울림은 앞쪽에 둡니다.',7);
  [0,1,2,1].forEach((r,i)=>{
    add(t2,{kind:'sing',tag:'소리',dur:9,lead:1,anim:'steady',title:'음 → 아 (앞 공명)',hint:'코 옆과 광대가 울리는 느낌을 모음까지 가져갑니다.',say:COUNT[i],rep:i+1,reps:4,tone:{type:'hold',rise:r},
      phases:[{at:1,title:'음~',hint:'코 옆과 광대가 울리는지 확인합니다.'},{at:4,title:'아~',hint:'입을 열어도 앞쪽 울림은 그대로 둡니다. 코로만 밀지 않습니다.'}]});
    rest(t2,3);
  });

  const t3 = mk('모음','모음 모양 다듬기','같은 음에서 우-오-아-에-이 바꿔 부르기');

    rest(t3,3);
  });

  const t4 = mk('숨결','숨 섞기 조절','숨을 많이, 적게, 알맞게 섞어 부르기');
  prep(t4,'숨 섞기','같은 음 아에서 숨을 섞는 양만 바꿉니다. 숨이 많으면 부드럽고 감성적인 톤, 적으면 선명한 톤이 됩니다.','같은 음 아에서, 숨을 섞는 양만 바꿔 보세요.',8);

    rest(t4,3);

  for(let i=0;i<4;i++){
    add(t5,{kind:'sing',tag:'소리',dur:9,lead:1,anim:'swell',title:'우~ 사이렌',hint:'소리가 갈라지거나 끊기는 지점에서는 더 작고 가볍게 합니다.',say:COUNT[i],rep:i+1,reps:4,tone:{type:'glide',path:[0,10,0]}});
    rest(t5,3);

  const t6 = mk('내 톤','내 톤 찾기','곡의 쉬운 구절로 톤을 비교하고 고르기');
  prep(t6,'곡 구절 고르기','부를 곡에서 가장 편한 한 구절을 정합니다. 같은 구절을 톤만 바꿔 세 번 부릅니다.','곡에서 가장 편한 한 구절을 정하세요. 같은 구절을 톤만 바꿔 세 번 부릅니다.',8);
  add(t6,{kind:'sing',tag:'소리',dur:15,anim:'steady',title:'1. 따뜻하고 둥근 톤',hint:'하품 자세로 목 안을 넓히고 숨을 조금 섞어서 부릅니다.',say:'먼저 하품 자세로, 숨을 조금 섞어 따뜻하고 둥글게 불러 보세요.'});

  add(g7,{kind:'rest',tag:'쉬기',dur:15,anim:'rest',title:'녹음해서 원곡과 비교하기',hint:'내 녹음과 원곡을 번갈아 들어 보세요. 닮은 점을 찾기보다 내 목에 편하고 마음에 드는 톤을 고릅니다. 천천히 들으려면 일시정지를 누르세요.',say:'녹음해서 원곡과 번갈아 들어 보세요. 내 목에 편한 톤을 고르세요.'});

const ROUTINES = {
  warmup:{label:'워밍업',build:buildWarmup,
    intro:'목소리 높이를 고른 뒤 시작하세요. 이어폰을 쓰면 안내음이 더 잘 들립니다.',
    doneTitle:'워밍업 끝',doneHint:'가장 쉬운 구절부터 작게 시작하세요. 목이 불편하면 쉬어 주세요.'},
  tone:{label:'톤 만들기',build:buildTone,
    intro:'워밍업을 마친 뒤에 시작하세요. 목소리 높이를 고르고, 부를 곡의 쉬운 구절 하나를 떠올려 두세요.',
    doneTitle:'톤 연습 끝',doneHint:'마음에 든 톤을 기억해 두고, 곡에서 그 느낌으로 불러 보세요. 목이 불편하면 쉬어 주세요.'},
  style:{label:'성시경 스타일',build:buildStyle,
    intro:'따뜻하고 힘 뺀 발라드 톤의 방향을 잡는 연습입니다. 똑같이 만드는 것이 아닙니다. 워밍업을 마친 뒤에 시작하세요.',
    doneTitle:'스타일 연습 끝',doneHint:'내 목에 편하고 마음에 드는 톤을 기억해 두세요. 목이 불편하면 쉬어 주세요.'},
  cooldown:{label:'쿨다운',build:buildCooldown,
    intro:'노래를 마친 뒤에 시작하세요. 모든 소리는 작고 편하게 냅니다.',
    doneTitle:'쿨다운 끝',doneHint:'오늘은 목을 아끼세요. 쉰 소리나 통증이 2주 이상 이어지면 이비인후과에 가 보세요.'}
};
const ORDER = ['warmup','tone','style','cooldown'];

/* timeline */
let flat = [], TOTAL = 0, routineKey = 'warmup';
function compile(key){
  steps = []; flat = [];
  ROUTINES[key].build();
  let acc = 0;
  steps.forEach((s,si)=>{
    s.start = acc;
    s.cues.forEach(c=>{ c.start = acc; c.step = si; flat.push(c); acc += c.dur; });
    s.end = acc; s.dur = s.end - s.start;
  });
  TOTAL = acc;
  routineKey = key;
}
ORDER.forEach(k=>{ compile(k); ROUTINES[k].total = TOTAL; });
compile(settings.mode);
function cueIndexAt(e){
  for(let i=flat.length-1;i>=0;i--){ if(e >= flat[i].start) return i; }
  return 0;
}

/* ---------- audio ---------- */
let ctx = null, master = null, active = [];
function ensureAudio(){
  try{
    if(!ctx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return false;
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = settings.vol/100;
      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 2000;
      master.connect(lp); lp.connect(ctx.destination);
    }
    if(ctx.state === 'suspended') ctx.resume();
    return true;
  }catch(e){ return false; }
}
function voice(path,t0,dur,env){
  const g = ctx.createGain(); g.gain.value = 0; g.connect(master);
  const o1 = ctx.createOscillator(); o1.type = 'sine';
  const o2 = ctx.createOscillator(); o2.type = 'sine';
  const g2 = ctx.createGain(); g2.gain.value = 0.22;
  o1.connect(g); o2.connect(g2); g2.connect(g);
  o1.frequency.setValueAtTime(path[0][1],t0);
  o2.frequency.setValueAtTime(path[0][1]*2,t0);
  for(let i=1;i<path.length;i++){
    o1.frequency.linearRampToValueAtTime(path[i][1],t0+path[i][0]);
    o2.frequency.linearRampToValueAtTime(path[i][1]*2,t0+path[i][0]);
  }
  g.gain.setValueAtTime(0.0001,t0);
  env.forEach(p => g.gain.linearRampToValueAtTime(p[1],t0+p[0]));
  const end = t0+dur+0.05;
  o1.start(t0); o2.start(t0); o1.stop(end); o2.stop(end);
  const rec = {g,o1,o2};
  active.push(rec);
  o1.onended = () => { active = active.filter(a=>a!==rec); try{ g.disconnect(); }catch(e){} };
}
const envHold = (d,a,r,pk=.5) => [[0,0],[a,pk],[Math.max(a,d-r),pk],[d,0]];
const envSwell = (d,pk=.5) => [[0,.02],[d*.25,pk*.3],[d*.5,pk],[d*.75,pk*.3],[d,.02]];
const envFade = (d,pk=.5) => [[0,0],[.2,pk],[d*.5,pk],[d*.75,pk*.35],[d,0]];
function stopTones(){
  if(!ctx) return;
  const now = ctx.currentTime;
  active.forEach(a=>{
    try{
      a.g.gain.cancelScheduledValues(now);
      a.g.gain.setTargetAtTime(0,now,0.02);
      a.o1.stop(now+0.12); a.o2.stop(now+0.12);
    }catch(e){}
  });
}
function playCueTone(c){
  if(!settings.tone || !c.tone || !ensureAudio()) return;
  const T = c.tone, d = c.dur - c.lead;
  const base = rootMidi() + (T.rise||0);
  const f = n => midiFreq(base+n);
  const t0 = ctx.currentTime + 0.03 + c.lead;
  if(T.type === 'seq'){
    T.notes.forEach((n,k)=> voice([[0,f(n)]],t0+k*T.noteDur,T.noteDur*0.94,envHold(T.noteDur*0.94,0.05,0.12)));
  }else if(T.type === 'glide'){
    const pts = T.path.map((n,k)=>[k*d/(T.path.length-1),f(n)]);
    voice(pts,t0,d,envHold(d,0.25,0.4));
  }else if(T.type === 'swell'){
    voice([[0,f(0)]],t0,d,envSwell(d));
  }else if(T.type === 'fade'){
    voice([[0,f(0)]],t0,d,envFade(d));
  }else{
    voice([[0,f(0)]],t0,d,envHold(d,T.attack||0.15,0.35));
  }
}
function previewTone(){
  if(!ensureAudio()) return;
  stopTones();
  const t0 = ctx.currentTime + 0.05;
  voice([[0,midiFreq(rootMidi())]],t0,1.8,envHold(1.8,0.15,0.4));
}

/* ---------- speech ---------- */
let koVoice = null;
const hasSpeech = 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined';
function loadVoices(){
  if(!hasSpeech) return;
  const vs = speechSynthesis.getVoices();
  koVoice = vs.find(v => /^ko/i.test(v.lang)) || null;
  updateVoiceNote(vs.length);
}
function updateVoiceNote(n){
  const note = $('voiceNote');
  if(!hasSpeech){ note.hidden = false; note.textContent = '이 브라우저는 음성 안내를 지원하지 않습니다. 화면 안내를 따라 주세요.'; }
  else if(n > 0 && !koVoice){ note.hidden = false; note.textContent = '이 기기에는 한국어 음성이 없어 화면과 안내음으로만 진행됩니다.'; }
  else note.hidden = true;
}
function speak(text){
  if(!settings.voice || !text || !hasSpeech) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    if(koVoice) u.voice = koVoice;
    u.rate = 0.95;
    speechSynthesis.speak(u);
  }catch(e){}
}
function cancelSpeech(){ if(hasSpeech){ try{ speechSynthesis.cancel(); }catch(e){} } }
function primeSpeech(){
  if(!hasSpeech) return;
  try{ const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); }catch(e){}
}

/* ---------- wake lock ---------- */
let wake = null;
async function acquireWake(){
  try{
    if('wakeLock' in navigator && !wake){
      wake = await navigator.wakeLock.request('screen');
      wake.addEventListener('release',()=>{ wake = null; });
    }
  }catch(e){}
}
function releaseWake(){ try{ if(wake) wake.release(); }catch(e){} wake = null; }
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState === 'visible' && state.mode === 'running') acquireWake();
});

/* ---------- state ---------- */
const state = {mode:'idle', elapsed:0, last:0, idx:-1};
let shownIdx = -1, shown = .58, lastTs = 0, noteEls = [], noteK = -2;
const cache = {};
const el = {
  stage:$('stage'), steps:$('steps'), orb:$('orb'), count:$('count'), tag:$('tag'),
  chipStep:$('chipStep'), chipRep:$('chipRep'), title:$('cueTitle'), hint:$('cueHint'),
  notes:$('notes'), next:$('next'), main:$('mainBtn'), prev:$('prevBtn'), nextBtn:$('nextBtn'),
  totalBar:$('totalBar'), elapsedTxt:$('elapsedTxt'), remainTxt:$('remainTxt'), routine:$('routine')
};
function setText(node,key,txt){ if(cache[key] !== txt){ cache[key] = txt; node.textContent = txt; } }
function curElapsed(){
  if(state.mode === 'running') return Math.min(TOTAL, state.elapsed + (performance.now()-state.last)/1000);
  return state.elapsed;
}

/* ---------- build static UI ---------- */
let stepBtns = [], stepBars = [], routineLis = [], modeBtns = [];
function buildUI(){
  stepBtns = []; stepBars = []; routineLis = [];
  el.steps.replaceChildren(); el.routine.replaceChildren();
  el.steps.style.gridTemplateColumns = 'repeat('+steps.length+',minmax(0,1fr))';
  steps.forEach((s,k)=>{
  const b = document.createElement('button');
  b.type = 'button';
  b.setAttribute('aria-label', s.name+' 구간으로 이동');
  const label = document.createElement('span'); label.textContent = s.short;
  const bar = document.createElement('div'); bar.className = 'bar';
  const fill = document.createElement('i'); bar.append(fill);
  b.append(label,bar);
  b.addEventListener('click',()=>jumpTo(k));
  el.steps.append(b); stepBtns.push(b); stepBars.push(fill);

  const li = document.createElement('li');
  const rb = document.createElement('button'); rb.type = 'button';
  const dot = document.createElement('span'); dot.className = 'dot'; dot.setAttribute('aria-hidden','true');
  const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = s.name;
  const tm = document.createElement('span'); tm.className = 'tm'; tm.textContent = fmt(s.dur);
  const ds = document.createElement('span'); ds.className = 'ds'; ds.textContent = s.desc;
  rb.append(dot,nm,tm,ds);
  rb.addEventListener('click',()=>jumpTo(k));
  li.append(rb); el.routine.append(li); routineLis.push(li);
  });
  $('meta').textContent = ROUTINES[routineKey].label+' · '+steps.length+'구간 · 약 '+Math.round(TOTAL/60)+'분 · 총 '+fmt(TOTAL);
}
function buildModes(){
  const box = $('modes');
  box.replaceChildren(); modeBtns = [];
  ORDER.forEach(k=>{
    const b = document.createElement('button'); b.type = 'button';
    const l = document.createElement('span'); l.textContent = ROUTINES[k].label;
    const t = document.createElement('small'); t.textContent = '약 '+Math.round(ROUTINES[k].total/60)+'분';
    b.append(l,t);
    b.addEventListener('click',()=>selectRoutine(k));
    box.append(b); modeBtns.push(b);
  });
  syncModes();
}
function syncModes(){
  const lock = state.mode === 'running' || state.mode === 'paused';
  modeBtns.forEach((b,i)=>{
    const on = ORDER[i] === routineKey;
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
    b.disabled = lock && !on;
    b.title = (lock && !on) ? '진행 중에는 바꿀 수 없습니다. 처음으로를 누르세요.' : '';
  });
}

/* ---------- rendering ---------- */
function buildNotes(c){
  el.notes.replaceChildren(); noteEls = []; noteK = -2;
  if(c.tone && c.tone.type === 'seq'){
    el.notes.dataset.empty = 'false';
    c.tone.notes.forEach(n=>{
      const d = document.createElement('div'); d.className = 'nt';
      const b = document.createElement('span'); b.style.height = (12+n*6)+'px';
      const l = document.createElement('small'); l.textContent = SOLFEGE[n] || '';
      d.append(b,l); el.notes.append(d); noteEls.push(b);
    });
  }else{
    el.notes.dataset.empty = 'true';
  }
}
function renderCue(i){
  const c = flat[i], s = steps[c.step];
  el.stage.dataset.kind = (c.kind === 'breath' || c.kind === 'sing' || c.kind === 'stretch') ? c.kind : 'rest';
  setText(el.chipStep,'cs','구간 '+(c.step+1)+'/'+steps.length+' · '+s.name);
  if(c.reps){ el.chipRep.hidden = false; setText(el.chipRep,'cr',c.rep+'/'+c.reps+'회'); } else { el.chipRep.hidden = true; }
  setText(el.tag,'tag',c.tag);
  buildNotes(c);
  let j = i+1;
  while(j < flat.length && flat[j].kind === 'rest') j++;
  const n = flat[j];
  let nx = '마지막 동작입니다';
  if(n) nx = (n.step === c.step && n.title === c.title) ? '다음: 한 번 더' : '다음: '+n.title;
  setText(el.next,'nx',nx);
  stepBtns.forEach((b,k)=>{ if(k === c.step) b.setAttribute('aria-current','step'); else b.removeAttribute('aria-current'); });
  routineLis.forEach((li,k)=>{ li.dataset.state = k < c.step ? 'done' : (k === c.step ? 'active' : 'todo'); });
}
function renderLive(e,i){
  const c = flat[i], t = e - c.start;
  let title = c.title, hint = c.hint;
  if(state.mode === 'idle' && e === 0){
    title = '준비되셨나요?';
    hint = ROUTINES[routineKey].intro;
  }else if(state.mode === 'done'){
    title = ROUTINES[routineKey].doneTitle;
    hint = ROUTINES[routineKey].doneHint;
  }else if(c.phases){
    for(const p of c.phases){ if(t >= p.at){ title = p.title; hint = p.hint || c.hint; } }
  }
  setText(el.title,'ti',title);
  setText(el.hint,'hi',hint);

  if(state.mode === 'running' || state.mode === 'paused'){
    setText(el.count,'co',String(Math.max(0,Math.ceil(c.dur - t))));
    setText(el.tag,'tag',c.tag);
  }else if(state.mode === 'done'){
    setText(el.count,'co','완료'); setText(el.tag,'tag','수고하셨습니다');
  }else{
    setText(el.count,'co',fmt(TOTAL - e)); setText(el.tag,'tag',e === 0 ? '전체 시간' : '남은 시간');
  }

  if(noteEls.length){
    const k = Math.floor((t - c.lead)/c.tone.noteDur);
    if(k !== noteK){
      noteK = k;
      noteEls.forEach((b,idx)=>{ b.className = idx === k ? 'on' : (idx < k ? 'past' : ''); });
    }
  }
  steps.forEach((s,k)=>{
    const pct = clamp((e - s.start)/s.dur,0,1)*100;
    stepBars[k].style.width = pct.toFixed(1)+'%';
  });
  el.totalBar.style.width = (clamp(e/TOTAL,0,1)*100).toFixed(1)+'%';
  setText(el.elapsedTxt,'el',fmt(e));
  setText(el.remainTxt,'re','-'+fmt(TOTAL - e));
}
function view(){
  const e = curElapsed();
  const i = state.mode === 'done' ? flat.length-1 : cueIndexAt(e);
  if(i !== shownIdx){ shownIdx = i; renderCue(i); }
  renderLive(e,i);
}
function updateMain(){
  const m = state.mode;
  let label = '시작하기';
  if(m === 'running') label = '일시정지';
  else if(m === 'paused') label = '계속하기';
  else if(m === 'done') label = '다시 하기';
  else if(state.elapsed > 0) label = '여기서 시작';
  el.main.textContent = label;
  const e = curElapsed();
  const si = flat[state.mode === 'done' ? flat.length-1 : cueIndexAt(e)].step;
  el.nextBtn.disabled = si >= steps.length-1 || m === 'done';
  syncModes();
}

/* ---------- control ---------- */
function onCueStart(c){ speak(c.say); playCueTone(c); }
function logic(){
  if(state.mode !== 'running') return;
  const now = performance.now();
  state.elapsed += (now - state.last)/1000;
  state.last = now;
  if(state.elapsed >= TOTAL){ finish(); return; }
  const i = cueIndexAt(state.elapsed);
  if(i !== state.idx){ state.idx = i; onCueStart(flat[i]); }
  view();
  updateMain();
}
function start(){
  ensureAudio(); primeSpeech();
  if(state.mode === 'done') state.elapsed = 0;
  const i = cueIndexAt(state.elapsed);
  state.elapsed = flat[i].start;
  state.idx = -1; state.mode = 'running'; state.last = performance.now();
  acquireWake(); logic(); updateMain();
}
function pause(){
  state.mode = 'paused';
  stopTones(); cancelSpeech(); releaseWake();
  view(); updateMain();
}
function finish(){
  state.mode = 'done'; state.elapsed = TOTAL;
  stopTones(); releaseWake();
  shownIdx = -1; view(); updateMain();
}
function reset(){
  stopTones(); cancelSpeech(); releaseWake();
  state.mode = 'idle'; state.elapsed = 0; state.idx = -1;
  shownIdx = -1; view(); updateMain();
}
function jumpTo(k){
  k = clamp(k,0,steps.length-1);
  stopTones(); cancelSpeech();
  state.elapsed = steps[k].start;
  if(state.mode === 'done') state.mode = 'idle';
  state.idx = -1;
  if(state.mode === 'running'){ state.last = performance.now(); logic(); }
  shownIdx = -1; view(); updateMain();
}
function selectRoutine(k){
  if(k === routineKey || state.mode === 'running' || state.mode === 'paused') return;
  stopTones(); cancelSpeech(); releaseWake();
  compile(k); settings.mode = k; save();
  state.mode = 'idle'; state.elapsed = 0; state.idx = -1;
  shownIdx = -1;
  buildUI(); view(); updateMain();
}
function currentStep(){
  return flat[state.mode === 'done' ? flat.length-1 : cueIndexAt(curElapsed())].step;
}
el.main.addEventListener('click',()=>{
  if(state.mode === 'running') pause(); else start();
});
el.prev.addEventListener('click',()=>{
  const si = currentStep();
  const into = curElapsed() - steps[si].start;
  jumpTo(into > 3 ? si : si-1);
});
el.nextBtn.addEventListener('click',()=>jumpTo(currentStep()+1));
$('resetBtn').addEventListener('click',reset);

/* ---------- settings UI ---------- */
function applySettings(){
  $('gM').setAttribute('aria-pressed', settings.gender === 'm' ? 'true' : 'false');
  $('gF').setAttribute('aria-pressed', settings.gender === 'f' ? 'true' : 'false');
  const r = rootMidi();
  $('rootTxt').textContent = noteName(r)+' · '+Math.round(midiFreq(r))+'Hz';
  $('voiceChk').checked = settings.voice;
  $('toneChk').checked = settings.tone;
  $('vol').value = settings.vol;
  $('shDown').disabled = settings.shift <= -5;
  $('shUp').disabled = settings.shift >= 5;
  if(master) master.gain.value = settings.vol/100;
}
$('gM').addEventListener('click',()=>{ settings.gender = 'm'; save(); applySettings(); });
$('gF').addEventListener('click',()=>{ settings.gender = 'f'; save(); applySettings(); });
$('shDown').addEventListener('click',()=>{ settings.shift = Math.max(-5,settings.shift-1); save(); applySettings(); });
$('shUp').addEventListener('click',()=>{ settings.shift = Math.min(5,settings.shift+1); save(); applySettings(); });
$('voiceChk').addEventListener('change',e=>{ settings.voice = e.target.checked; if(!settings.voice) cancelSpeech(); save(); });
$('toneChk').addEventListener('change',e=>{ settings.tone = e.target.checked; if(!settings.tone) stopTones(); save(); });
$('vol').addEventListener('input',e=>{ settings.vol = Number(e.target.value); if(master) master.gain.value = settings.vol/100; save(); });
$('previewBtn').addEventListener('click',previewTone);

/* ---------- orb animation ---------- */
const ease = x => x < .5 ? 2*x*x : 1 - Math.pow(-2*x+2,2)/2;
function scaleFor(c,t){
  const d = Math.max(0.1,c.dur - c.lead);
  const p = clamp((t - c.lead)/d,0,1);
  switch(c.anim){
    case 'in': return .5 + .5*ease(p);
    case 'out': return 1 - .5*ease(p);
    case 'swell': return .5 + .5*Math.sin(Math.PI*p);
    case 'fade': return p < .5 ? .95 : .95 - .45*ease((p-.5)*2);
    case 'steady': return .78 + .03*Math.sin(t*1.6);
    default: return .5;
  }
}
function frame(ts){
  requestAnimationFrame(frame);
  const dt = Math.min(.1,(ts - (lastTs || ts))/1000);
  lastTs = ts;
  let target;
  if(state.mode === 'running'){
    const e = curElapsed();
    const c = flat[cueIndexAt(e)];
    target = scaleFor(c,e - c.start);
  }else if(state.mode === 'idle'){
    target = .58 + .02*Math.sin(ts/900);
  }else{
    target = .58;
  }
  shown += (target - shown)*Math.min(1,dt*10);
  el.orb.style.transform = 'scale('+shown.toFixed(3)+')';
}

/* ---------- init ---------- */
if(hasSpeech){
  loadVoices();
  try{ speechSynthesis.addEventListener('voiceschanged',loadVoices); }catch(e){}
}else{
  updateVoiceNote(0);
}
applySettings();
buildUI();
buildModes();
view();
updateMain();
requestAnimationFrame(frame);
setInterval(logic,100);
})();
